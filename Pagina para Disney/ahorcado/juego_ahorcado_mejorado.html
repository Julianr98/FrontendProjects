<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego del ahorcado</title>

  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --text:#111827; --muted:#6b7280;
      --border:#e5e7eb; --radius:16px; --shadow:0 8px 24px rgba(17,24,39,.08);
      --space:16px; --space2:24px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans";
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New";
    }

    *{ box-sizing: border-box; }
    body{ margin:0; font-family:var(--font); color:var(--text); background:var(--bg); }
    h2{ max-width: 980px; margin: var(--space2) auto var(--space); padding: 0 var(--space); font-size: 22px; }

    .game{ max-width:980px; margin:0 auto; padding: 0 var(--space) var(--space2); }
    .top{ display:grid; grid-template-columns: 1fr; gap: var(--space); }
    @media (min-width: 900px){ .top{ grid-template-columns: 320px 1fr 240px; align-items:start; } }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding: 14px;
    }

    .card__title{ margin:0 0 10px; font-size: 14px; color: var(--muted); font-weight:600; }

    .hangman{
      width:100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      background:#fff;
      display:block;
    }

    textarea, input[type="text"], select{
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 12px;
      background:#fff;
      color:var(--text);
      font-family: var(--mono);
    }

    select{ font-family: var(--font); }

    textarea{ resize:none; min-height: 120px; }

    .word{ margin-top: var(--space); }
    .word__row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .muted{ color:var(--muted); font-size: 13px; }
    .status{ margin: 10px 0 0; color: var(--muted); }

    .controls{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:flex-end;
      margin-top: 10px;
    }
    .control{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width: 180px;
      flex: 1;
    }
    .control span{ font-size: 12px; color: var(--muted); }

    .badgeWrap{ display:flex; align-items:center; gap:10px; padding: 10px 12px; border:1px dashed var(--border); border-radius: 12px; }
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width: 34px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border:1px solid var(--border);
      background:#fff;
      font-weight: 700;
      font-family: var(--font);
    }

    .keyboard{
      margin-top: var(--space);
      display:grid;
      gap:10px;
      grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));
    }

    input[type="button"]{
      border:1px solid var(--border);
      background:#fff;
      border-radius:12px;
      padding:10px 12px;
      cursor:pointer;
      min-height: 42px;
      transition: transform .06s ease, box-shadow .12s ease, background .12s ease;
      font-family: var(--font);
    }
    input[type="button"]:hover{ box-shadow: 0 6px 16px rgba(17,24,39,.08); }
    input[type="button"]:active{ transform: translateY(1px); }
    input[type="button"]:focus-visible{ outline:3px solid rgba(59,130,246,.35); outline-offset:2px; }

    input[type="button"].is-used, input[type="button"]:disabled{
      opacity:.55; cursor:not-allowed; box-shadow:none;
    }

    .actions{ margin-top: var(--space); display:flex; justify-content:flex-end; gap:10px; }
    input[name="Inicia"]{ font-weight: 800; }

    .stats .stat{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .stats input[type="text"]{ max-width: 90px; text-align:center; }

    .sr-only{
      position:absolute !important;
      width:1px; height:1px;
      padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0);
      white-space:nowrap; border:0;
    }

    .footer{
      max-width: 980px;
      margin: 0 auto;
      padding: 0 var(--space) var(--space2);
      text-align:center;
    }

    hr{ border:0; border-top:1px solid var(--border); margin: 24px 0; }
  </style>

  <script>
    /* ========= Datos ========= */
    var hombre = new Array("___\n", "   |\n", "   O\n", "  /", "|", "\\\
", "  /", " \\\n", "___")
    var palabra
    var partes = 0
    var colNueva = 0
    var jugando = false
    var letrasUsadas = null

    var categoriaActual = "tecnologia"
    var dificultadActual = "media"
    var maxFallos = 9

    // Listas por categoría (puedes añadir más palabras)
    var palabrasPorCategoria = {
      tecnologia: [
        "multimedia", "internauta", "servidor", "protocolo", "cortafuegos",
        "navegador", "nodo", "marco", "pagina", "telaraña",
        "descargar", "virtual", "memoria", "disco", "local",
        "conectar", "desconectar", "encaminador", "internet", "dominio",
        "dinamico", "hipervinculo", "enlace", "marcador", "ordenador",
        "lapiz", "ofimatica", "informe"
      ],
      animales: [
        "tortuga", "elefante", "jirafa", "rinoceronte", "murcielago",
        "canguro", "delfin", "ballena", "camaleon", "pinguino",
        "orangutan", "mariposa", "escorpion"
      ],
      comida: [
        "empanada", "arepa", "tamal", "spaghetti", "chocolate",
        "hamburguesa", "ensalada", "sancocho", "tostada", "quesadilla",
        "guacamole"
      ],
      lugares: [
        "colombia", "mexico", "argentina", "barcelona", "bogota",
        "medellin", "lima", "quito", "montevideo", "caracas",
        "valparaiso"
      ]
    }

    /* ========= Helpers ========= */
    function SetStatus(msg){
      var el = document.getElementById("status")
      if (el) el.textContent = msg || ""
      UpdateBadge()
    }

    function UpdateBadge(){
      var b = document.getElementById("attemptsBadge")
      if (b) b.textContent = String(IntentosRestantes())
    }

    function IntentosRestantes(){
      return Math.max(0, maxFallos - partes)
    }

    function ToggleBotones(visor, enabled){
      for (var i = 0; i < visor.elements.length; i++){
        var el = visor.elements[i]
        if (el && el.type === "button" && el.name && el.name.indexOf("bot") === 0){
          el.disabled = !enabled
          if (enabled) el.classList.remove("is-used")
        }
      }
    }

    function DeshabilitaBoton(visor, letra){
      var key = (letra || "").toUpperCase()
      var btn = visor["bot" + key]
      if (btn){
        btn.disabled = true
        btn.classList.add("is-used")
      }
    }

    function GetSettings(){
      var cat = document.getElementById("categorySelect")
      var dif = document.getElementById("difficultySelect")
      categoriaActual = cat ? cat.value : "tecnologia"
      dificultadActual = dif ? dif.value : "media"

      // Vidas según dificultad
      if (dificultadActual === "facil") maxFallos = 9
      else if (dificultadActual === "media") maxFallos = 9
      else maxFallos = 7 // difícil

      UpdateBadge()
    }

    // Normaliza letras: quita tildes, pero respeta la ñ
    function NormChar(ch){
      ch = (ch || "").toLowerCase()
      if (ch === "ñ") return "ñ"
      try {
        return ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      } catch (e) {
        return ch
      }
    }

    function ToLetters(str){
      var clean = (str || "").toLowerCase().replace(/\s+/g, "")
      var arr = []
      for (var i=0; i<clean.length; i++){
        arr.push(NormChar(clean[i]))
      }
      return arr
    }

    function DificultadFiltra(lista, dificultad){
      if (!lista || !lista.length) return []
      var out = []
      for (var i=0; i<lista.length; i++){
        var letters = ToLetters(lista[i])
        var L = letters.length

        if (dificultad === "facil" && L <= 8) out.push(lista[i])
        else if (dificultad === "media" && L >= 7 && L <= 11) out.push(lista[i])
        else if (dificultad === "dificil" && L >= 10) out.push(lista[i])
      }
      return out
    }

    function PoolPalabras(){
      var pool = []
      if (categoriaActual === "todas"){
        for (var key in palabrasPorCategoria){
          pool = pool.concat(palabrasPorCategoria[key])
        }
      } else {
        pool = palabrasPorCategoria[categoriaActual] || palabrasPorCategoria.tecnologia
      }

      var filtradas = DificultadFiltra(pool, dificultadActual)
      // fallback si la categoría no tiene suficientes palabras para esa dificultad
      if (!filtradas.length) filtradas = pool
      return filtradas
    }

    /* ========= CANVAS ========= */
    function PrepCanvas(){
      var c = document.getElementById("hangmanCanvas")
      if (!c) return null

      var rect = c.getBoundingClientRect()
      var w = Math.max(220, rect.width || 260)
      var h = Math.max(220, rect.height || 260)

      var dpr = window.devicePixelRatio || 1
      c.width  = Math.round(w * dpr)
      c.height = Math.round(h * dpr)

      var ctx = c.getContext("2d")
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)

      return { ctx: ctx, w: w, h: h }
    }

    function Line(ctx, x1,y1,x2,y2){
      ctx.beginPath()
      ctx.moveTo(x1,y1)
      ctx.lineTo(x2,y2)
      ctx.stroke()
    }

    function Circle(ctx, x,y,r){
      ctx.beginPath()
      ctx.arc(x,y,r,0,Math.PI*2)
      ctx.stroke()
    }

    function Clamp(n, a, b){ return Math.max(a, Math.min(b, n)) }

    function CanvasStepFromPartes(){
      if (!maxFallos) return partes
      var ratio = partes / maxFallos
      var step = Math.round(ratio * 9)
      return Clamp(step, 0, 9)
    }

    function DibujaCanvas(step){
      var pack = PrepCanvas()
      if (!pack) return
      var ctx = pack.ctx, w = pack.w, h = pack.h

      ctx.clearRect(0,0,w,h)
      ctx.lineWidth = 4
      ctx.lineCap = "round"
      ctx.strokeStyle = "#111827"

      // base SIEMPRE visible
      var pad = 18
      var baseY = h - pad
      var poleX = pad + 40
      var topY  = pad + 18
      var beamX = w - pad - 40

      Line(ctx, pad, baseY, w - pad, baseY)   // base
      Line(ctx, poleX, baseY, poleX, topY)    // poste
      Line(ctx, poleX, topY, beamX, topY)     // viga

      // Progresión
      if (step >= 1) Line(ctx, beamX, topY, beamX, topY + 35) // cuerda

      var headX = beamX
      var headY = topY + 55
      var r = 18

      if (step >= 2) Circle(ctx, headX, headY, r)                  // cabeza
      if (step >= 3) Line(ctx, headX, headY + r, headX, headY + 85) // torso
      if (step >= 4) Line(ctx, headX, headY + 45, headX - 30, headY + 65) // brazo izq
      if (step >= 5) Line(ctx, headX, headY + 45, headX + 30, headY + 65) // brazo der
      if (step >= 6) Line(ctx, headX, headY + 85, headX - 26, headY + 120) // pierna izq
      if (step >= 7) Line(ctx, headX, headY + 85, headX + 26, headY + 120) // pierna der

      if (step >= 8){
        // ojos
        Line(ctx, headX - 7, headY - 6, headX - 2, headY - 1)
        Line(ctx, headX + 7, headY - 6, headX + 2, headY - 1)
      }
      if (step >= 9){
        // boca
        Line(ctx, headX - 8, headY + 10, headX + 8, headY + 10)
      }
    }

    /* ========= Lógica del juego ========= */
    function ObtienePalabra(){
      var pool = PoolPalabras()
      var indice = Math.floor(Math.random() * pool.length)
      palabra = ToLetters(pool[indice])
    }

    function DibujaHombre(visor, partes){
      // Fallback ASCII (oculto) + canvas visible
      var dibujo = ""
      if (partes < 10)
        for (var x = 0; x < partes; x++) dibujo += hombre[x]
      visor.displayHombre.value = dibujo

      DibujaCanvas(CanvasStepFromPartes())
    }

    function DibujaLetra(visor, letra){
      var flag = false
      var actual = (visor.displayPalabra.value || "").trim()
      var letrasCadena = actual ? actual.split(/\s+/) : []

      var cadena = ""
      for (var x = 0; x < palabra.length; x++){
        if (palabra[x] === letra){
          cadena += letra + " "
          flag = true
        } else {
          cadena += (letrasCadena[x] || "_") + " "
        }
      }
      visor.displayPalabra.value = cadena
      return flag
    }

    function NuevaLetra(visor, letra){
      visor.displayLetras.value += letra.toUpperCase() + " "
      if (colNueva == 7){ visor.displayLetras.value += "\n"; colNueva = 0 }
      else colNueva++
    }

    function CompruebaPalabra(visor){
      var cadena = (visor.displayPalabra.value || "").trim()
      if (!cadena) return false
      var letrasCadena = cadena.split(/\s+/)
      for (var x = 0; x < letrasCadena.length; x++)
        if (letrasCadena[x] == "_") return false
      return true
    }

    function Juega(visor, letra){
      if (!jugando){
        alert("Pulsa Juego nuevo para comenzar\nuna partida nueva.")
        return
      }

      letra = NormChar(letra)

      if (!letrasUsadas) letrasUsadas = {}
      if (letrasUsadas[letra]){
        SetStatus("Esa letra ya la usaste: '" + letra.toUpperCase() + "'. Te quedan " + IntentosRestantes() + " intentos.")
        return
      }

      letrasUsadas[letra] = true
      DeshabilitaBoton(visor, letra)
      NuevaLetra(visor, letra)

      var acierto = DibujaLetra(visor, letra)

      if (!acierto){
        DibujaHombre(visor, ++partes)
        SetStatus("Fallaste con '" + letra.toUpperCase() + "'. Te quedan " + IntentosRestantes() + " intentos.")
      } else {
        SetStatus("¡Bien! '" + letra.toUpperCase() + "' está en la palabra. Te quedan " + IntentosRestantes() + " intentos.")
      }

      if (partes == maxFallos) FinJuego(false)
      else if (CompruebaPalabra(visor)) FinJuego(true)
    }

    function IniciaJuego(visor){
      GetSettings()

      jugando = true
      partes = 0
      colNueva = 0
      letrasUsadas = {}

      ObtienePalabra()
      DibujaHombre(visor, partes)

      visor.displayPalabra.value = ""
      for (var x = 0; x < palabra.length; x++) visor.displayPalabra.value += "_ "

      visor.displayLetras.value = ""
      ToggleBotones(visor, true)

      var labelCat = (categoriaActual === "todas") ? "Todas" : categoriaActual
      var labelDif = (dificultadActual === "facil") ? "Fácil" : (dificultadActual === "media" ? "Media" : "Difícil")
      var hint = (dificultadActual === "facil") ? (" Pista: empieza con '" + palabra[0].toUpperCase() + "'.") : ""

      SetStatus("Nueva partida (" + labelCat + " / " + labelDif + "). Longitud: " + palabra.length + "." + hint + " Te quedan " + IntentosRestantes() + " intentos.")
    }

    function FinJuego(resultado){
      var solucion = ""
      jugando = false
      ToggleBotones(document.visor, false)

      for (var x = 0; x < palabra.length; x++) solucion += palabra[x]

      if (resultado){
        document.visor.ganadas.value++
        SetStatus("¡Ganaste! Pulsa “Juego nuevo” para jugar otra vez.")
        alert("Acertaste !")
      } else {
        document.visor.perdidas.value++
        SetStatus("Perdiste. La palabra era: " + solucion.toUpperCase() + ". Pulsa “Juego nuevo” para intentarlo de nuevo.")
        alert("Has muerto !\n La palabra era: " + solucion.toUpperCase())
      }
    }

    function LimpiarMarcador(visor){
      visor.ganadas.value = "0"
      visor.perdidas.value = "0"
      SetStatus("Marcador reiniciado. Pulsa “Juego nuevo” para empezar.")
    }

    /* ========= Teclado + resize ========= */
    window.addEventListener("load", function(){
      if (document.visor) ToggleBotones(document.visor, false)
      GetSettings()
      DibujaCanvas(0)

      document.addEventListener("keydown", function(e){
        var t = e.target
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return
        if (e.ctrlKey || e.metaKey || e.altKey) return

        var key = (e.key || "").toLowerCase()

        if (key === "enter"){
          if (document.visor) IniciaJuego(document.visor)
          return
        }

        // permite escribir ñ
        var allowed = "abcdefghijklmnñopqrstuvwxyz"
        if (allowed.indexOf(key) !== -1 && document.visor) Juega(document.visor, key)
      })

      window.addEventListener("resize", function(){
        DibujaCanvas(CanvasStepFromPartes())
      })
    })
  </script>
</head>

<body>
  <h2>Juego del ahorcado</h2>

  <form name="visor" class="game" autocomplete="off">
    <div class="top">
      <section class="card" aria-label="Ahorcado">
        <h3 class="card__title">Ahorcado</h3>
        <canvas id="hangmanCanvas" class="hangman" aria-label="Dibujo del ahorcado"></canvas>
        <textarea name="displayHombre" cols="15" rows="6" readonly class="sr-only"></textarea>
      </section>

      <section class="card" aria-label="Letras usadas">
        <h3 class="card__title">Letras usadas</h3>
        <textarea name="displayLetras" cols="15" rows="6" readonly></textarea>
      </section>

      <aside class="card stats" aria-label="Marcador">
        <h3 class="card__title">Marcador</h3>

        <div class="stat">
          <span class="muted">Ganadas</span>
          <input type="text" name="ganadas" size="4" value="0" readonly>
        </div>

        <div class="stat">
          <span class="muted">Perdidas</span>
          <input type="text" name="perdidas" size="4" value="0" readonly>
        </div>

        <input type="button" value="Limpiar" name="B1" onClick="LimpiarMarcador(this.form)">
      </aside>
    </div>

    <div class="card word" aria-label="Configuración y palabra">
      <div class="word__row">
        <span class="muted">Palabra</span>
        <input name="displayPalabra" size="42" readonly>
      </div>

      <div class="controls" aria-label="Opciones">
        <label class="control">
          <span>Categoría</span>
          <select id="categorySelect" onChange="GetSettings()">
            <option value="todas">Todas</option>
            <option value="tecnologia" selected>Tecnología</option>
            <option value="animales">Animales</option>
            <option value="comida">Comida</option>
            <option value="lugares">Lugares</option>
          </select>
        </label>

        <label class="control">
          <span>Dificultad</span>
          <select id="difficultySelect" onChange="GetSettings()">
            <option value="facil">Fácil</option>
            <option value="media" selected>Media</option>
            <option value="dificil">Difícil</option>
          </select>
        </label>

        <div class="badgeWrap" aria-label="Intentos restantes">
          <span class="muted">Intentos</span>
          <span class="badge" id="attemptsBadge">9</span>
        </div>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">
        Pulsa “Juego nuevo” para empezar. (Tip: también puedes usar el teclado)
      </p>
    </div>

    <div class="card keyboard" aria-label="Teclado">
      <input type="button" name="botA" value="A" onClick="Juega(this.form, 'a')">
      <input type="button" name="botB" value="B" onClick="Juega(this.form, 'b')">
      <input type="button" name="botC" value="C" onClick="Juega(this.form, 'c')">
      <input type="button" name="botD" value="D" onClick="Juega(this.form, 'd')">
      <input type="button" name="botE" value="E" onClick="Juega(this.form, 'e')">
      <input type="button" name="botF" value="F" onClick="Juega(this.form, 'f')">
      <input type="button" name="botG" value="G" onClick="Juega(this.form, 'g')">
      <input type="button" name="botH" value="H" onClick="Juega(this.form, 'h')">
      <input type="button" name="botI" value="I" onClick="Juega(this.form, 'i')">
      <input type="button" name="botJ" value="J" onClick="Juega(this.form, 'j')">
      <input type="button" name="botK" value="K" onClick="Juega(this.form, 'k')">
      <input type="button" name="botL" value="L" onClick="Juega(this.form, 'l')">
      <input type="button" name="botM" value="M" onClick="Juega(this.form, 'm')">
      <input type="button" name="botN" value="N" onClick="Juega(this.form, 'n')">
      <input type="button" name="botÑ" value="Ñ" onClick="Juega(this.form, 'ñ')">
      <input type="button" name="botO" value="O" onClick="Juega(this.form, 'o')">
      <input type="button" name="botP" value="P" onClick="Juega(this.form, 'p')">
      <input type="button" name="botQ" value="Q" onClick="Juega(this.form, 'q')">
      <input type="button" name="botR" value="R" onClick="Juega(this.form, 'r')">
      <input type="button" name="botS" value="S" onClick="Juega(this.form, 's')">
      <input type="button" name="botT" value="T" onClick="Juega(this.form, 't')">
      <input type="button" name="botU" value="U" onClick="Juega(this.form, 'u')">
      <input type="button" name="botV" value="V" onClick="Juega(this.form, 'v')">
      <input type="button" name="botW" value="W" onClick="Juega(this.form, 'w')">
      <input type="button" name="botX" value="X" onClick="Juega(this.form, 'x')">
      <input type="button" name="botY" value="Y" onClick="Juega(this.form, 'y')">
      <input type="button" name="botZ" value="Z" onClick="Juega(this.form, 'z')">
    </div>

    <div class="actions">
      <input type="button" name="Inicia" value="Juego nuevo" onClick="IniciaJuego(this.form)">
    </div>
  </form>

  <hr>
  <div class="footer">
    <a href="javascript:history.back()">[Volver]</a>
  </div>
</body>
</html>
